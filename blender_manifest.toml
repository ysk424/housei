schema_version = "1.0.0"

id = "housei"
version = "0.5.0"
name = "縫製"
tagline = "縫製: Cut out, Zero GRAVITY, ZOZO (HOU parts from Katagami/MCP)"
maintainer = "Yoshihiko Tsukamoto"
type = "add-on"

blender_version_min = "5.2.0"
platforms = ["windows-x64"]

license = ["SPDX:GPL-3.0-or-later"]

tags = ["Modeling", "Pipeline"]

[permissions]
files = "Write temporary ZOZO MCP configuration for localhost hand-off"
network = "Configure ZOZO Contact Solver through its localhost MCP server"

[build]
paths = [
    "__init__.py",
    "ui.py",
    "i18n.py",
    "hou.py",
    "kitsuke.py",
    "zero_gravity.py",
    "solver_backend.py",
    "backend_ppf.py",
    "backends/ppf/driver.py",
    "backends/ppf/remesh.py",
    "backends/ppf/clear.py",
    "sewing_plan.py",
    "zozo_handoff.py",
    "zozo_mcp_client.py",
    "shell_isect_bridge.py",
    "mesh_loader.py",
    "SVG_TO_JSON_SPEC.md",
    "HOU_DESIGN.md",
    "SEWING_PLAN_DESIGN.md",
    "DOWNSTREAM_PROTOCOL.md",
    "KITSUKE_DESIGN.md",
    "PPF_ZERO_GRAVITY_DESIGN.md",
    "ZOZO_HANDOFF_DESIGN.md",
    "GRAINLINE_DESIGN.md",
    "SEAM_BOUNDARY_LAYER_DESIGN.md",
    "THIRD_PARTY_NOTICES.md",
    "README.md",
    "DEVELOPMENT_NOTES.md",
    "UTIL/silhouette_export.py",
    "UTIL/README.md",
    "LICENSE",
    "bin/vcomp140.dll",
    "bin/shell_isect.dll",
    "bin/SHELL_ISECT_README.txt",
]
